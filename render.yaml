services:
  # Django Web API (Free Tier)
  - type: web
    name: rolematch-django
    runtime: docker
    plan: free
    dockerfilePath: ./django_backend/Dockerfile
    dockerContext: ./django_backend
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CACHE_REDIS_URL
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # FastAPI Service (Free Tier)
  - type: web
    name: rolematch-fastapi
    runtime: docker
    plan: free
    dockerfilePath: ./fastapi_service/Dockerfile
    dockerContext: ./fastapi_service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4o-mini"