services:
  db:
    image: postgres:15-alpine
    container_name: resume_postgres
    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resume_redis
    ports:
      - "6379:6379"

  fastapi:
    build: ./fastapi_service
    container_name: resume_fastapi
    ports:
      - "8001:8001"
    volumes:
      - ./fastapi_service:/app
    environment:
      - PYTHONUNBUFFERED=1

  django:
    build: ./django_backend
    container_name: resume_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=resume_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - FASTAPI_INTERNAL_URL=http://fastapi:8001
    depends_on:
      - db
      - redis
      - fastapi

  celery_worker:
    build: ./django_backend
    container_name: resume_celery
    command: celery -A core worker --loglevel=info
    volumes:
      - ./django_backend:/app
    environment:
      - DB_NAME=resume_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - FASTAPI_INTERNAL_URL=http://fastapi:8001
    depends_on:
      - db
      - redis
      - django

volumes:
  postgres_data:
