[project]
name = "django-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "dj-rest-auth[with-social]>=7.2.0",
    "django-allauth[socialaccount]>=65.19.7",
    "django-cors-headers>=4.9.0",
    "django-stubs>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-stubs>=3.18.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "python-dotenv>=1.2.4",
    "django-unfold>=0.110.1",
    "psycopg2-binary>=2.9.13",
    "celery>=5.7.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "gunicorn>=27.0.1",
    "openai>=3.57.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
markers = [
    "happy_path: Core expected behavior and success flows",
    "edge_case: Boundary inputs and validation guards",
    "retries: Celery retry, timeout, and credit-refund failure handling",
]

[project.scripts]
django-backend = "django_backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
]
