[project]
name = "django-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "dj-rest-auth[with-social]>=7.2.0",
    "django-allauth[socialaccount]>=65.19.7",
    "django-cors-headers>=4.9.0",
    "django-stubs>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-stubs>=3.18.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
django-backend = "django_backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
